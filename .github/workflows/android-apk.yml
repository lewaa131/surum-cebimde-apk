name: Sürüm Cebimde Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

  # Savannah zaman zaman 502 verdiği için kullandığımız ayna
  URL_freetype: "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"

  # C/C++ derlemelerini sonraki çalışmalarda hızlandırır
  CCACHE_DIR: "${{ github.workspace }}/.ccache"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. PROJEYI AL
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. DERLEME BAGIMLILIKLARI
      # ============================================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            gcc \
            g++ \
            make \
            patch \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            lbzip2 \
            wget \
            curl


      # ============================================================
      # 5. BUILDOZER
      # ============================================================
      - name: Install Buildozer
